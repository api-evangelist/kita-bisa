aid: kita-bisa
name: Kita Bisa
description: 'Kitabisa is Indonesia''s largest donation-based crowdfunding and mutual-aid
  platform, founded in 2013 and headquartered in Jakarta. It lets individuals, nonprofits,
  and corporations raise and give funds transparently for medical causes, disaster
  relief, education, and community development, and operates a dedicated Islamic-philanthropy
  surface for zakat, wakaf, and qurban. The group has grown beyond crowdfunding into
  digital fundraising services for NGOs (ngo.kitabisa.com), a CSR and social-marketing
  practice for corporate partners (csr.kitabisa.com), a cooperative, and the SalingJaga
  mutual-protection and insurance product. Kitabisa publishes no public API or developer
  program — there is no developer portal, API reference, or OpenAPI definition on
  any Kitabisa surface, and partner integrations are arranged through business channels.
  It does run a substantial first-party open source estate of 75 public Go, TypeScript,
  and GitHub Actions repositories, plus a public responsible-disclosure program backed
  by an RFC 9116 security.txt.'
