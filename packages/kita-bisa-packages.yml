  public API program. What it does publish is a substantial first-party open
  source estate (75 public repos) of Go infrastructure, security and payment
  libraries produced by its engineering teams. Those are catalogued here as
  Packages. No `SDKs` pointer is emitted in apis.yml, because none of these are
  client libraries for a Kitabisa API.
